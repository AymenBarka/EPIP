[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epip"
version = "0.1.0"
description = "Elliott Pattern Intelligence Platform"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Aymen Barka" }
]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "plotly",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy"
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["UP040"]

[tool.setuptools.packages.find]
where = ["."]
include = ["epip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true