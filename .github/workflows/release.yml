name: Release validation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate semantic tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          [[ "$(git cat-file -t "refs/tags/${tag}")" == "tag" ]]

      - name: Validate release notes and version reference
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/project/releases/${GITHUB_REF_NAME}.md"
          test -s "$notes"
          grep -Fq "${GITHUB_REF_NAME}" "$notes"
          grep -Fq "${GITHUB_REF_NAME}" docs/project/ROADMAP.md

      - name: Validate changelog update
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          test -s CHANGELOG.md
          if [[ -n "$previous" ]]; then
            git diff --name-only "$previous" "$tag" | grep -Fxq CHANGELOG.md
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Validate release quality
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
          python scripts/quality.py

      - name: Validate release documentation
        run: |
          python -m pip install mkdocs-material
          mkdocs build --strict
