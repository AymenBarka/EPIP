name: Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "mkdocs.yml"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "mkdocs.yml"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Markdown style
        run: npx --yes markdownlint-cli2 "**/*.md" "#/.venv/**"

      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline "**/*.md"
          fail: true

      - name: Mermaid syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/epip-mermaid
          cat > /tmp/epip-puppeteer.json <<'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          EOF
          while IFS= read -r file; do
            output="/tmp/epip-mermaid/$(echo "$file" | tr '/ ' '__').md"
            npx --yes @mermaid-js/mermaid-cli \
              -p /tmp/epip-puppeteer.json \
              -i "$file" \
              -o "$output"
          done < <(grep -rl '^```mermaid' --include='*.md' .)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build documentation website
        run: |
          python -m pip install mkdocs-material
          mkdocs build --strict
