name: Documentation

on:
  push:
    branches: [main, develop]
    paths: ["**/*.md", ".github/workflows/documentation.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/documentation.yml"]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Markdown style
        run: npx --yes markdownlint-cli2 "**/*.md" "#/.venv/**"

      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline "**/*.md"
          fail: true

      - name: Mermaid syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/epip-mermaid
          while IFS= read -r file; do
            output="/tmp/epip-mermaid/$(echo "$file" | tr '/ ' '__').md"
            npx --yes @mermaid-js/mermaid-cli -i "$file" -o "$output"
          done < <(grep -rl '^```mermaid' --include='*.md' .)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build documentation website
        run: |
          python -m pip install mkdocs-material
          mkdocs build --strict
