name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Black
        run: python -m black --check epip tests

      - name: Ruff
        run: python -m ruff check epip tests

      - name: MyPy
        run: python -m mypy epip tests

      - name: Pytest and coverage
        run: >-
          python -m pytest
          --deselect=tests/core/test_eventbus_stress.py::test_640000_publications_are_lossless_unique_and_fifo
          --cov=epip --cov-report=term-missing --cov-fail-under=95

      - name: EventBus stress
        run: >-
          python -m pytest
          tests/core/test_eventbus_stress.py::test_640000_publications_are_lossless_unique_and_fifo
          -q
